<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Threads Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 1200px;
            height: 90vh;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, #4a90e2, #357abd);
            color: white;
            padding: 20px;
            text-align: center;
            position: relative;
        }

        .chat-header h1 {
            font-size: 1.8em;
            margin-bottom: 5px;
        }

        .chat-header p {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .status {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 12px;
            padding: 5px 10px;
            border-radius: 20px;
            background: rgba(255,255,255,0.2);
        }

        .status.connected {
            background: #4caf50;
        }

        .status.disconnected {
            background: #f44336;
        }

        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f5f5f5;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 70%;
            animation: fadeIn 0.3s ease;
        }

        .message.sent {
            align-self: flex-end;
        }

        .message.received {
            align-self: flex-start;
        }

        .message-bubble {
            padding: 10px 15px;
            border-radius: 18px;
            word-wrap: break-word;
            position: relative;
        }

        .message.sent .message-bubble {
            background: linear-gradient(135deg, #4a90e2, #357abd);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.received .message-bubble {
            background: white;
            color: #333;
            border-bottom-left-radius: 4px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        .message-username {
            font-size: 0.75em;
            margin-bottom: 3px;
            margin-left: 5px;
            font-weight: bold;
            color: #666;
        }

        .message.sent .message-username {
            text-align: right;
            color: #e0e0e0;
        }

        .message-time {
            font-size: 0.7em;
            margin-top: 3px;
            margin-left: 5px;
            color: #999;
        }

        .message.sent .message-time {
            text-align: right;
        }

        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }

        .input-group {
            flex: 1;
            display: flex;
            gap: 10px;
        }

        input {
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }

        input:focus {
            border-color: #4a90e2;
        }

        #usernameInput {
            width: 150px;
        }

        #messageInput {
            flex: 1;
        }

        button {
            padding: 12px 25px;
            background: linear-gradient(135deg, #4a90e2, #357abd);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(74,144,226,0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .message {
                max-width: 85%;
            }

            #usernameInput {
                width: 100px;
            }

            .input-group {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
<div class="chat-container">
    <div class="chat-header">
        <h1>💬 Threads Chat</h1>
        <p>Real-time messaging with WebSocket</p>
        <div class="status disconnected" id="status">Connecting...</div>
    </div>

    <div class="messages-area" id="messagesArea">
        <div style="text-align: center; color: #999; padding: 20px;">
            Connecting to chat server...
        </div>
    </div>

    <div class="input-area">
        <div class="input-group">
            <input type="text" id="usernameInput" placeholder="Username" maxlength="50" autocomplete="off">
            <input type="text" id="messageInput" placeholder="Type your message..." maxlength="500" autocomplete="off" onkeypress="handleKeyPress(event)">
            <button id="sendBtn" onclick="sendMessage()">Send</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

<script>
    let stompClient = null;
    let connected = false;
    let currentUsername = localStorage.getItem('chatUsername') || '';

    // DOM elements
    const messagesArea = document.getElementById('messagesArea');
    const usernameInput = document.getElementById('usernameInput');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const statusDiv = document.getElementById('status');

    // Load saved username
    if (currentUsername) {
        usernameInput.value = currentUsername;
    }

    // Connect to WebSocket
    function connect() {
        const socket = new SockJS('/ws');
        stompClient = Stomp.over(socket);

        // Disable debug logging
        stompClient.debug = null;

        stompClient.connect({}, onConnected, onError);
    }

    // On successful connection
    function onConnected() {
        connected = true;
        statusDiv.textContent = 'Connected';
        statusDiv.className = 'status connected';
        sendBtn.disabled = false;

        console.log('WebSocket connected');

        // Subscribe to public topic for receiving all messages
        stompClient.subscribe('/topic/all', onMessageReceived);

        // Load initial messages via WebSocket
        loadMessages();
    }

    // On connection error
    function onError(error) {
        connected = false;
        statusDiv.textContent = 'Disconnected';
        statusDiv.className = 'status disconnected';
        sendBtn.disabled = true;
        console.error('WebSocket error:', error);

        // Try to reconnect after 5 seconds
        setTimeout(connect, 5000);
    }

    // Load messages using WebSocket (@MessageMapping /getMessages with @SendToUser)
    function loadMessages() {
        if (!connected || !stompClient) {
            showSystemMessage('Not connected to server. Reconnecting...');
            return;
        }

        // Send request to get messages - this will go to /app/getMessages
        stompClient.send('/app/getMessages', {}, JSON.stringify({}));

        // Subscribe to user's private queue to receive the messages
        stompClient.subscribe('/user/queue/reply', function(response) {
            try {
                const messages = JSON.parse(response.body);
                displayMessages(messages);
            } catch(e) {
                console.error('Error parsing messages:', e);
            }
        });
    }

    // Send message using WebSocket (@MessageMapping /sendMessage)
    function sendMessage() {
        const username = usernameInput.value.trim();
        const text = messageInput.value.trim();

        if (!username) {
            showSystemMessage('Please enter your username!');
            usernameInput.focus();
            return;
        }

        if (!text) {
            showSystemMessage('Please enter a message!');
            messageInput.focus();
            return;
        }

        if (!connected || !stompClient) {
            showSystemMessage('Not connected to server. Please wait...');
            return;
        }

        // Save username to localStorage
        localStorage.setItem('chatUsername', username);

        // Create message object
        const message = {
            userName: username,
            text: text
        };

        // Send message via WebSocket to /app/sendMessage
        stompClient.send('/app/sendMessage', {}, JSON.stringify(message));

        // Clear input field
        messageInput.value = '';
        messageInput.focus();
    }

    // Receive messages from /topic/all subscription
    function onMessageReceived(response) {
        try {
            const messages = JSON.parse(response.body);
            displayMessages(messages);
        } catch(e) {
            console.error('Error parsing received message:', e);
        }
    }

    // Display messages in the chat area
    function displayMessages(messages) {
        if (!messages || messages.length === 0) {
            messagesArea.innerHTML = '<div style="text-align: center; color: #999; padding: 20px;">No messages yet. Be the first to send a message!</div>';
            return;
        }

        const currentUser = usernameInput.value.trim();
        let html = '';

        // Convert Iterable to array if needed
        const messagesArray = Array.isArray(messages) ? messages : Object.values(messages);

        messagesArray.forEach(msg => {
            const isSent = currentUser && msg.userName === currentUser;
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const userName = msg.userName || 'Anonymous';
            const text = msg.text || '';

            html += `
                <div class="message ${isSent ? 'sent' : 'received'}">
                    <div class="message-username">${escapeHtml(userName)}</div>
                    <div class="message-bubble">${escapeHtml(text)}</div>
                    <div class="message-time">${time}</div>
                </div>
            `;
        });

        messagesArea.innerHTML = html;

        // Auto-scroll to bottom
        scrollToBottom();
    }

    // Show system message (temporary notification)
    function showSystemMessage(text) {
        const systemMsg = document.createElement('div');
        systemMsg.style.textAlign = 'center';
        systemMsg.style.color = '#999';
        systemMsg.style.fontSize = '12px';
        systemMsg.style.padding = '5px';
        systemMsg.style.fontStyle = 'italic';
        systemMsg.textContent = text;
        messagesArea.appendChild(systemMsg);
        scrollToBottom();

        // Remove after 3 seconds
        setTimeout(() => {
            if (systemMsg.parentNode) {
                systemMsg.remove();
            }
        }, 3000);
    }

    // Scroll to bottom of messages
    function scrollToBottom() {
        messagesArea.scrollTop = messagesArea.scrollHeight;
    }

    // Escape HTML to prevent XSS
    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // Handle Enter key press
    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            sendMessage();
        }
    }

    // Save username on change
    usernameInput.addEventListener('change', function() {
        localStorage.setItem('chatUsername', this.value.trim());
    });

    // Initial connection
    connect();
</script>
</body>
</html>
